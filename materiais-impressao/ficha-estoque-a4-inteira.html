<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ficha de estoque — A4 inteira</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #17233a; font-family: Arial, sans-serif; }
    .card { width: 210mm; height: 297mm; padding: 10mm; }
    header { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 2mm; border-bottom: 1.5px solid #2864e7; }
    .brand { color: #2864e7; font-size: 8pt; font-weight: bold; letter-spacing: .7px; }
    h1 { margin: 1mm 0 0; color: #102247; font-size: 18pt; }
    .folio { font-size: 9pt; white-space: nowrap; }
    .blank { display: inline-block; min-width: 35mm; border-bottom: 1px solid #7e8da2; }
    .helper { margin: 2mm 0; padding: 1.5mm 3mm; border-radius: 3px; background: #f0f5ff; color: #455d80; font-size: 8pt; line-height: 1.2; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; margin: 2mm 0; font-size: 8.5pt; }
    .line { display: inline-block; width: 100%; min-height: 4mm; border-bottom: 1px solid #6f7f95; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 8pt; }
    th { height: 7mm; padding: 1mm; background: #2864e7; color: white; border: 1px solid #174aa9; line-height: 1.05; text-align: center; }
    td { height: 7mm; border: 1px solid #a8b6c8; }
    th:nth-child(1) { width: 7%; }
    th:nth-child(2) { width: 43%; }
    th:nth-child(3) { width: 14%; }
    th:nth-child(4) { width: 14%; }
    th:nth-child(5) { width: 22%; }
    footer { margin-top: 1mm; color: #718199; font-size: 6.5pt; line-height: 1; text-align: center; }
    /* VersÃ£o econÃ´mica: legÃ­vel em impressora preto e branco. */
    body { color: #111; }
    header { border-bottom-color: #222; }
    .brand, h1 { color: #111; }
    .helper { background: #fff; border: 1px solid #777; color: #222; }
    .line, .blank { border-color: #333; }
    th { background: #262626; border-color: #111; color: #fff; }
    td { border-color: #777; }
    footer { color: #444; }
  </style>
</head>
<body>
  <article class="card">
    <header>
      <div><div class="brand">LF ERP · FICHA MANUAL</div><h1>Controle de estoque</h1></div>
      <div class="folio">Folha nº: <span class="blank"></span></div>
    </header>
    <div class="helper">Anote conferências e mercadorias recebidas. Depois atualize a quantidade em <strong>Cadastros → Produtos</strong>.</div>
    <div class="fields"><div>Data: <span class="line"></span></div><div>Responsável: <span class="line"></span></div></div>
    <table>
      <thead><tr><th>Qtd.</th><th>Produto</th><th>Custo</th><th>Venda</th><th>Observação</th></tr></thead>
      <tbody id="linhas"></tbody>
    </table>
    <footer>Confira a quantidade física antes de alterar o estoque no sistema.</footer>
  </article>
  <script>
    document.getElementById('linhas').innerHTML = '<tr><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(34);
  </script>
</body>
</html>
